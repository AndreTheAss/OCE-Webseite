version: "3.8"

services:
  ocevent-wordpress:
    image: wordpress:php8.2-apache
    container_name: ocevent-wordpress
    restart: unless-stopped
    depends_on:
      - ocevent-db
    environment:
      WORDPRESS_DB_HOST: ocevent-db:3306
      WORDPRESS_DB_NAME: ocevent_db
      WORDPRESS_DB_USER: ocevent_user
      WORDPRESS_DB_PASSWORD: BitteAendern123!
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
    volumes:
      - ocevent_site:/var/www/html
    labels:
      - "traefik.enable=true"

      # Netzwerk für Traefik
      - "traefik.docker.network=traefik_proxy"

      # HTTPS Router
      - "traefik.http.routers.ocevent.rule=Host(`oc-event.de`) || Host(`www.oc-event.de`)"
      - "traefik.http.routers.ocevent.entrypoints=websecure"
      - "traefik.http.routers.ocevent.tls=true"
      - "traefik.http.routers.ocevent.tls.certresolver=myresolver"

      # Service (WordPress läuft intern auf Port 80)
      - "traefik.http.services.ocevent.loadbalancer.server.port=80"

      # HTTP Router (Redirect auf HTTPS)
      - "traefik.http.routers.ocevent-http.rule=Host(`oc-event.de`) || Host(`www.oc-event.de`)"
      - "traefik.http.routers.ocevent-http.entrypoints=web"
      - "traefik.http.routers.ocevent-http.middlewares=ocevent-redirect"

      # Middleware Redirect
      - "traefik.http.middlewares.ocevent-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ocevent-redirect.redirectscheme.permanent=true"
    networks:
      - npm_default
      - traefik_proxy
      - ocevent-internal

  ocevent-db:
    image: mariadb:11
    container_name: ocevent-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: BitteAendern123!
      MARIADB_DATABASE: ocevent_db
      MARIADB_USER: ocevent_user
      MARIADB_PASSWORD: BitteAendern123!
    volumes:
      - ocevent_db_data:/var/lib/mysql
    networks:
      - ocevent-internal

  ocevent-phpmyadmin:
    image: phpmyadmin:latest
    container_name: ocevent-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ocevent-db
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: "256M"
    ports:
      - "8086:80"
    networks:
      - ocevent-internal

networks:
  npm_default:
    external: true
  traefik_proxy:
    external: true
  ocevent-internal:
    driver: bridge

volumes:
  ocevent_site:
  ocevent_db_data:
